name: Build DMG

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-latest сейчас резолвится в macos-26, где нет Xcode 16.x — образ зафиксирован.
    runs-on: macos-15
    # create-dmg.sh берёт корень из $(pwd), поэтому работаем из корня репозитория.
    defaults:
      run:
        shell: bash
        working-directory: .
    permissions:
      # Токен с правом записи нужен шагу публикации релиза; сборка и тесты ничего не пишут.
      # Триггеров на pull_request нет, так что форкнутый PR этот воркфлоу не запускает.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Рекомендованная мейнтейнерами раннеров стабильная версия на этом образе.
          xcode-version: '16.4'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build DMG
        run: ./scripts/create-dmg.sh --clean

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: NetworkManager-dmg
          path: NetworkManager.dmg
          # Образ уже сжат (UDZO) — повторное сжатие только жжёт CPU.
          compression-level: 0

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Пропавший DMG должен ронять джобу, а не молча публиковать пустой релиз.
          fail_on_unmatched_files: true
          files: NetworkManager.dmg
          # Текст релиза на английском — README тоже английский, страница релиза
          # публичная и должна читаться одним языком.
          body: |
            ${{ github.event.repository.description }}

            Installation and setup are documented in the [README](${{ github.server_url }}/${{ github.repository }}#readme).

            ### Install

            1. Open `NetworkManager.dmg` and drag **NetworkManager.app** into `Applications`.
            2. Launch it from the menu bar (no Dock icon by design).
            3. Optional — enable passwordless toggles once, instead of a prompt per switch:
               run `Scripts/install-passwordless-sudo.sh` from this disk image with `sudo`.

            Revert the passwordless allowlist at any time:

            ```
            sudo rm /etc/sudoers.d/network-manager
            ```

            > The app is ad-hoc signed, so macOS will treat every rebuild as a new app.
            > If Gatekeeper warns, open it once via right-click → **Open**.